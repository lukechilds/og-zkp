[package]
name = "ogzkp-core"
version = "0.1.0"
edition = "2021"

[dependencies]
# Guest-compatible (always available)
bitcoin = { version = "0.32.7", default-features = false, features = ["secp-recovery"] }
rs_merkle = "1.5.0"
hex = "0.4"
time = "0.3.41"

# Host-only
anyhow = { version = "1", optional = true }
base64 = { version = "0.22.1", optional = true }
bincode = { version = "1", optional = true }
flate2 = { version = "1", default-features = false, features = ["rust_backend"], optional = true }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], optional = true }
risc0-zkvm = { version = "^3.0.1", features = ["prove"], optional = true }
serde = { version = "1.0", optional = true }

[features]
host = ["dep:anyhow", "dep:base64", "dep:bincode", "dep:flate2", "dep:reqwest", "dep:risc0-zkvm", "dep:serde", "bitcoin/default"]
