name: Release CLI

on:
  push:
    tags: ['cli-v*']

permissions:
  contents: write
  packages: write

jobs:
  build-guest:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install RISC Zero toolchain (rzup)
        run: |
          curl -L https://risczero.com/install | bash
          echo "$HOME/.risc0/bin" >> $GITHUB_PATH
          ~/.risc0/bin/rzup install rust 1.88.0
          ~/.risc0/bin/rzup install cpp 2024.1.5

      - name: Build guest ELF
        run: ./build.sh guest

      - name: Upload guest ELF
        uses: actions/upload-artifact@v4
        with:
          name: guest-elf
          path: target/riscv-guest/methods/og-zkp/riscv32im-risc0-zkvm-elf/docker/

  build:
    needs: build-guest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Free disk space
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download guest ELF
        uses: actions/download-artifact@v4
        with:
          name: guest-elf
          path: target/riscv-guest/methods/og-zkp/riscv32im-risc0-zkvm-elf/docker/

      - name: Install RISC Zero toolchain (rzup)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: |
          curl -L https://risczero.com/install | bash
          echo "$HOME/.risc0/bin" >> $GITHUB_PATH
          ~/.risc0/bin/rzup install rust 1.88.0
          ~/.risc0/bin/rzup install cpp 2024.1.5

      - name: Add Rust target
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: ./build.sh host ${{ matrix.target }}

      - name: Verify image ID
        run: |
          chmod +x dist/og-zkp-${{ matrix.target }}
          expected=$(cat host/expected-image-id)
          actual=$(dist/og-zkp-${{ matrix.target }} info --json | jq -r '.image_id')
          if [ "$actual" != "$expected" ]; then
            echo "::error::Image ID mismatch! Expected: $expected, Got: $actual"
            exit 1
          fi
          echo "Image ID verified: $actual"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: og-zkp-${{ matrix.target }}
          path: dist/og-zkp-${{ matrix.target }}

  build-verifier:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build verifier
        run: ./build.sh verifier ${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: og-zkp-verifier-${{ matrix.target }}
          path: dist/og-zkp-verifier-${{ matrix.target }}

  docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download linux amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: og-zkp-x86_64-unknown-linux-gnu
          path: dist/

      - name: Prepare binary
        run: chmod +x dist/og-zkp-x86_64-unknown-linux-gnu

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: ./build.sh docker

      - name: Push Docker image
        run: |
          version="${GITHUB_REF_NAME#cli-}"
          docker tag ghcr.io/lukechilds/og-zkp:latest ghcr.io/lukechilds/og-zkp:$version
          docker push ghcr.io/lukechilds/og-zkp:$version
          docker push ghcr.io/lukechilds/og-zkp:latest

  docker-verifier:
    needs: build-verifier
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download linux amd64 verifier binary
        uses: actions/download-artifact@v4
        with:
          name: og-zkp-verifier-x86_64-unknown-linux-gnu
          path: dist/

      - name: Prepare binary
        run: chmod +x dist/og-zkp-verifier-x86_64-unknown-linux-gnu

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: ./build.sh docker-verifier

      - name: Push Docker image
        run: |
          version="${GITHUB_REF_NAME#cli-}"
          docker tag ghcr.io/lukechilds/og-zkp-verifier:latest ghcr.io/lukechilds/og-zkp-verifier:$version
          docker push ghcr.io/lukechilds/og-zkp-verifier:$version
          docker push ghcr.io/lukechilds/og-zkp-verifier:latest

  release:
    needs: [build, build-verifier]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: og-zkp-*
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum og-zkp-* > sha256sums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            og-zkp-*
            sha256sums.txt
