name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-guest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install RISC Zero toolchain (rzup)
        run: |
          curl -L https://risczero.com/install | bash
          echo "$HOME/.risc0/bin" >> $GITHUB_PATH
          ~/.risc0/bin/rzup install rust 1.88.0
          ~/.risc0/bin/rzup install cpp 2024.1.5

      - name: Build guest ELF
        run: cargo build -p methods --release

      - name: Upload guest ELF
        uses: actions/upload-artifact@v4
        with:
          name: guest-elf
          path: target/riscv-guest/methods/og-zkp/riscv32im-risc0-zkvm-elf/docker/

  build:
    needs: build-guest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download guest ELF
        uses: actions/download-artifact@v4
        with:
          name: guest-elf
          path: target/riscv-guest/methods/og-zkp/riscv32im-risc0-zkvm-elf/docker/

      - name: Install RISC Zero toolchain (rzup)
        if: ${{ !matrix.use_cross }}
        run: |
          curl -L https://risczero.com/install | bash
          echo "$HOME/.risc0/bin" >> $GITHUB_PATH
          ~/.risc0/bin/rzup install rust 1.88.0
          ~/.risc0/bin/rzup install cpp 2024.1.5

      - name: Add Rust target
        if: ${{ !matrix.use_cross }}
        run: rustup target add ${{ matrix.target }}

      - name: Install cross
        if: ${{ matrix.use_cross }}
        run: cargo install cross --locked

      - name: Build (cargo)
        if: ${{ !matrix.use_cross }}
        run: RISC0_SKIP_BUILD=1 cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: ${{ matrix.use_cross }}
        run: RISC0_SKIP_BUILD=1 cross build --release --target ${{ matrix.target }}

      - name: Rename binary
        run: mv target/${{ matrix.target }}/release/og-zkp og-zkp-${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: og-zkp-${{ matrix.target }}
          path: og-zkp-${{ matrix.target }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: og-zkp-*
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum og-zkp-* > sha256sums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            og-zkp-*
            sha256sums.txt
