name: CI

on: push

env:
  RISC0_RUST_VERSION: "1.88.0"
  RISC0_CPP_VERSION: "2024.1.5"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@v4

      - &rustup-cache
        name: Cache Rust toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
            ~/.rustup/settings.toml
          key: ${{ runner.os }}-rustup-${{ hashFiles('rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-rustup-

      - name: Check root workspace formatting
        run: cargo fmt --all -- --check

      - name: Check guest formatting
        run: cargo fmt --manifest-path methods/guest/Cargo.toml -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - &free-disk
        name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost

      - *checkout

      - *rustup-cache

      - &risc0-cache
        name: Cache RISC Zero toolchain
        uses: actions/cache@v4
        with:
          path: ~/.risc0
          key: ${{ runner.os }}-risc0-rust-${{ env.RISC0_RUST_VERSION }}-cpp-${{ env.RISC0_CPP_VERSION }}
          restore-keys: ${{ runner.os }}-risc0-

      - &cargo-cache
        name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            methods/guest/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - &install-risc0
        name: Install RISC Zero toolchain (rzup)
        run: |
          if [ ! -x "$HOME/.risc0/bin/rzup" ]; then
            curl -L https://risczero.com/install | bash
          fi
          echo "$HOME/.risc0/bin" >> $GITHUB_PATH
          ~/.risc0/bin/rzup install rust "$RISC0_RUST_VERSION"
          ~/.risc0/bin/rzup install cpp "$RISC0_CPP_VERSION"

      - name: Run root workspace clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run guest clippy
        run: cargo clippy --manifest-path methods/guest/Cargo.toml --all-targets --all-features -- -D warnings

  unit:
    runs-on: ubuntu-latest
    steps:
      - *free-disk

      - *checkout

      - *rustup-cache

      - *risc0-cache

      - *cargo-cache

      - *install-risc0

      - name: Run unit tests
        run: cargo test --workspace --lib --bin og-zkp

  e2e:
    runs-on: ubuntu-latest
    steps:
      - *free-disk

      - *checkout

      - *rustup-cache

      - *risc0-cache

      - *cargo-cache

      - *install-risc0

      - name: Run e2e tests
        run: cargo test --test e2e

      - name: Run real verifier fixture tests
        run: cargo test -p og-zkp-verifier

  e2e-fetch:
    runs-on: ubuntu-latest
    steps:
      - *free-disk

      - *checkout

      - *rustup-cache

      - *risc0-cache

      - *cargo-cache

      - *install-risc0

      - name: Run real lookup e2e tests
        run: cargo test --test real_lookup
