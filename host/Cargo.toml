[package]
name = "og-zkp"
version = "1.0.0"
edition = "2021"

[dependencies]
og-zkp-core = { path = "../core", features = ["host"] }
methods = { path = "../methods" }
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
anyhow = "1"

[dev-dependencies]
assert_cmd = "2"
base64 = "0.22.1"
bitcoin = "0.32.7"
hex = "0.4"
predicates = "3"
risc0-zkvm = "^3.0.5"
serde_json = "1"
