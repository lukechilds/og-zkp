[package]
name = "og-zkp"
version = "0.1.0"
edition = "2021"

[dependencies]
ogzkp-core = { path = "../core", features = ["host"] }
methods = { path = "../methods" }
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
anyhow = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serde_json = "1"
